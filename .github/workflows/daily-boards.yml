name: Daily boards

# Every morning after the boards are finalised (06:10 Beijing), add yesterday's CSV for each board.
# Also fills any of the last few days that are still missing, so a skipped run does not leave a gap.
on:
  schedule:
    - cron: '30 23 * * *'   # 07:30 Beijing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-boards
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}   # write token for the okdataapi org on Hugging Face; the mirror step is skipped without it
    steps:
      - uses: actions/checkout@v4

      - name: Fetch missing daily CSVs
        shell: bash
        run: |
          set -euo pipefail
          header='rank,name,heat,url,read_at_utc'   # the file's header must start with these; later columns (name_en) are kept
          added=0
          for back in 1 2 3; do
            day=$(TZ=Asia/Shanghai date -d "-${back} day" +%F)
            for board in douyin weibo xiaohongshu bilibili kuaishou; do
              out="data/${board}/${day}.csv"
              [ -f "$out" ] && continue
              tmp=$(mktemp)
              code=$(curl -sS -o "$tmp" -w '%{http_code}' --retry 3 --retry-delay 10 \
                "https://okdata.online/data/trends/${board}/${day}.csv" || echo 000)
              if [ "$code" != 200 ]; then
                echo "skip ${board} ${day}: HTTP ${code}"
                rm -f "$tmp"; continue
              fi
              first=$(head -n1 "$tmp" | tr -d '\r')
              if [ "${first#"$header"}" = "$first" ] || [ "$(wc -l < "$tmp")" -lt 2 ]; then
                echo "skip ${board} ${day}: unexpected content"
                rm -f "$tmp"; continue
              fi
              mkdir -p "data/${board}"
              mv "$tmp" "$out"
              echo "added ${out}"
              added=$((added + 1))
            done
          done
          echo "added=${added}" >> "$GITHUB_ENV"

      - name: Commit
        if: env.added != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "data: hot-search boards $(TZ=Asia/Shanghai date -d '-1 day' +%F)"
          git push

      # Keep huggingface.co/datasets/okdataapi/china-hot-search-daily in step with data/.
      # Unchanged files are not re-uploaded, so running it every day is cheap and also repairs a missed day.
      - name: Mirror data/ to Hugging Face
        if: env.HF_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet 'huggingface_hub>=0.30'
          python - <<'PY'
          from huggingface_hub import HfApi
          HfApi().upload_folder(
              repo_id='okdataapi/china-hot-search-daily',
              repo_type='dataset',
              folder_path='data',
              path_in_repo='data',
              allow_patterns='*/*.csv',
              commit_message='data: sync from github.com/okdataapi/china-trends',
          )
          PY
